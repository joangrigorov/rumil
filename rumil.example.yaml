# Rumil example configuration.
#
# Copy this file to rumil.yaml and fill in your own values. ${ENV_VAR}
# placeholders are expanded from the environment before the YAML is parsed, so
# secrets never have to live in the file itself.

app:
  bot_handle: "@rumil"
  max_agent_turns: 25             # 0 removes the cap; the job timeout still bounds the run
  max_diff_bytes: 250000          # Diffs larger than this are paginated by get_pr_diff
  log_level: "info"               # debug | info | warn | error

# Rumil ships no centralized GitHub App. Register your own App, install it on the
# repositories Rumil should review, and fill in the three credential values below.
github:
  app_id: 123456
  installation_id: 98765432       # Installation of your App on the target account
  private_key_path: "${GITHUB_APP_PRIVATE_KEY_PATH}" # Leave empty to use private_key below, or the GITHUB_PRIVATE_KEY environment variable
  # private_key: "${GITHUB_PRIVATE_KEY}"             # The PEM itself, for a secret store that hands over its contents rather than a path
  webhook_secret: "${GITHUB_WEBHOOK_SECRET}"         # Required from v0.0.3 for webhook verification

# Repository review guidelines are read before the first agent turn, from
# RUMIL.md at the repository root, and capped at 32 KB.
review:
  guidelines_ref: "base"          # base reads the pull request base SHA; head trusts the branch under review
  resolve_threads: true           # the reviewer resolves its own review threads once it verifies the finding is gone

# Older context is summarized when a session reaches the trigger. The trigger
# is deliberately high: 256K leaves room for a large pull request before any
# detail is condensed.
compaction:
  enabled: true
  trigger_tokens: 262144          # no compaction before this many estimated tokens
  reserve_tokens: 16384           # output budget kept below the trigger
  keep_recent_tokens: 20000       # most recent context kept verbatim

memory:                           # Used from v0.0.6
  repo_scope_boost: 0.05          # added to a repository rule's similarity when ranking, so a project exception outranks a general organization rule; 0 ranks by similarity alone

# `rumil serve` drains this queue.
worker:
  concurrency: 4                  # reviews processed in parallel; an idle worker polls the queue every 250ms

server:
  listen: ":8080"                 # HTTP address for the webhook endpoint, overridden by --listen

models:
  default_chat: "deepseek-v4-flash"    # Optional: defaults to the first provider that is not an embedding provider
  default_embedding: "text-embedding-3-small" # Required from v0.0.4
  providers:
    - id: "deepseek-v4-flash"
      provider: "openai-compatible"
      base_url: "https://api.deepseek.com/v1"
      model_name: "deepseek-v4-flash"
      api_key: "${DEEPSEEK_API_KEY}"
      temperature: 0.1
      max_tokens: 8192
    - id: "text-embedding-3-small"
      provider: "openai-compatible"
      base_url: "https://api.openai.com/v1"
      model_name: "text-embedding-3-small"
      api_key: "${OPENAI_API_KEY}"
      dimensions: 1536            # A provider with dimensions is an embedding provider. The width is the model's own: memory is stored and searched at it, and Rumil sizes memories.embedding to it on boot. 1536 for text-embedding-3-small, 768 for a local EmbeddingGemma

database:                         # Required from v0.0.3
  dsn: "${DATABASE_URL}"          # postgres://user:pass@db:5432/rumil?sslmode=disable
  auto_migrate: true

moderation:                       # Used from v0.0.4, surface from v0.0.5
  accept_all: false               # MUST stay false from v0.0.4 on: the bypass for the memory approval gate
  auto_approve_associations: []   # Optional: commenters with these GitHub author_associations record rules APPROVED, for example ["OWNER", "MEMBER"]
  admin_token: "${RUMIL_ADMIN_TOKEN}" # Bearer (or basic-auth password) for /ui/moderation and /api/moderation; unset disables them
