{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Rumil</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/app.css">
{{if .Refresh}}<meta http-equiv="refresh" content="{{.Refresh}}">{{end}}
</head>
<body class="console{{if .Fixed}} console-fixed{{end}}">
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <div class="topbar-inner">
    <!-- The Rumil mark, inlined from logo.svg so currentColor follows the theme. -->
    <a class="brand" href="/ui/moderation" aria-label="Rumil">
      <svg class="brand-logo" viewBox="0 0 1000 1040" aria-hidden="true" focusable="false">
        <g fill="currentColor">
          <path d="M 26 44 H 186 V 865 C 186 925, 205 948, 256 955 V 982 H 18 V 955 C 69 948, 88 925, 88 865 V 150 C 88 95, 70 74, 26 68 Z" />
          <path fill-rule="evenodd" d="M 470 14 A 346 346 0 1 1 469.9 14 Z M 470 100 A 260 260 0 1 0 470.1 100 Z" />
          <path d="M 470 232 L 497 333 L 598 360 L 497 387 L 470 488 L 443 387 L 342 360 L 443 333 Z" />
          <g transform="translate(470, 360) rotate(53.5)">
            <rect x="330" y="-32" width="100" height="64" />
            <rect x="405" y="-71" width="380" height="142" rx="68" ry="68" />
          </g>
        </g>
      </svg>
    </a>
    <nav class="nav" aria-label="Sections">
      <a href="/ui/moderation" {{if eq .Section "rules"}}aria-current="page"{{end}}>Rules</a>
      <a href="/ui/sessions" {{if eq .Section "sessions"}}aria-current="page"{{end}}>Sessions</a>
      <a href="/ui/queue" {{if eq .Section "queue"}}aria-current="page"{{end}}>Queue</a>
    </nav>
    <button type="button" class="theme-toggle" id="theme-toggle"
        aria-label="Color theme: Auto. Activate to switch to Dark."
        title="Theme: Auto (click for Dark)">◐</button>
    <span class="env">local admin</span>
  </div>
</header>
<main id="main" class="page">
{{template "content" .}}
</main>
<footer class="foot">
  <p>An approved rule is recorded context. The repository's <code>RUMIL.md</code> outranks it unless a maintainer promotes the rule to a directive.</p>
</footer>
</body>
</html>{{end}}
