{{define "content"}}
<div class="login-page">
  <section class="login-card" aria-labelledby="login-title">
    <div class="login-brand">
      <svg class="login-logo" viewBox="0 0 1000 1040" aria-hidden="true" focusable="false">
        <g fill="currentColor">
          <path d="M 26 44 H 186 V 865 C 186 925, 205 948, 256 955 V 982 H 18 V 955 C 69 948, 88 925, 88 865 V 150 C 88 95, 70 74, 26 68 Z" />
          <path fill-rule="evenodd" d="M 470 14 A 346 346 0 1 1 469.9 14 Z M 470 100 A 260 260 0 1 0 470.1 100 Z" />
          <path d="M 470 232 L 497 333 L 598 360 L 497 387 L 470 488 L 443 387 L 342 360 L 443 333 Z" />
          <g transform="translate(470, 360) rotate(53.5)">
            <rect x="330" y="-32" width="100" height="64" />
            <rect x="405" y="-71" width="380" height="142" rx="68" ry="68" />
          </g>
        </g>
      </svg>
      <span>Rumil</span>
    </div>
    <p class="eyebrow">Operator deck</p>
    <h1 id="login-title">Sign in</h1>
    <p class="lede">Reviews, recorded rules, and the queue for this installation.</p>

    {{if .Error}}<p class="login-error" role="alert"><span class="icon" aria-hidden="true">error</span>{{.Error}}</p>{{end}}

    <form class="login-form" method="post" action="/ui/login">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <input type="hidden" name="next" value="{{.Next}}">
      <label class="login-field">
        <span>Username</span>
        <input type="text" name="username" value="{{.Username}}" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      </label>
      <label class="login-field">
        <span>Password</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <label class="login-remember">
        <input type="checkbox" name="remember" value="1">
        <span>Remember me for 30 days</span>
      </label>
      <button class="btn btn-primary login-submit" type="submit">
        <span class="icon" aria-hidden="true">login</span>Sign in
      </button>
    </form>

    <p class="login-note">Access is limited to the users in <code>moderation.admin_users</code>.</p>
  </section>
</div>
{{end}}
